<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>GT Fit</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#1B2430; --ink-2:#3C4855; --iron:#5B6873; --line:#D5D9D6; --ground:#F2F3F1; --panel:#FFFFFF; --panel-2:#E9ECE9;
  --amber:#F7AD0B; --amber-ink:#7A5200; --amber-soft:#FFF3D1;
  --good:#2F8F5B; --good-soft:#DFF2E6; --warn:#C43D2F; --warn-soft:#F9E1DD;
  --bar:#1B2430; --on-bar:#FFFFFF; --sel:#1B2430; --on-sel:#F7AD0B;
  --c-gym:#eda100; --c-climb:#1baf7a; --c-walk:#2a78d6; --c-stretch:#e87ba4; --c-other:#7c5cd6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#ECEFF1; --ink-2:#C5CCD3; --iron:#8F9BA6; --line:#2E3842; --ground:#131920; --panel:#1B232C; --panel-2:#232D37;
  --amber:#F7AD0B; --amber-ink:#FFD777; --amber-soft:#3A2E10;
  --good:#5BC58A; --good-soft:#173324; --warn:#F07A6C; --warn-soft:#3F1F1B;
  --bar:#0E141A; --on-bar:#F2F3F1; --sel:#F7AD0B; --on-sel:#1B2430;
  --c-gym:#c98500; --c-climb:#199e70; --c-walk:#3987e5; --c-stretch:#d55181; --c-other:#9b7ee8;
}}
:root[data-theme="dark"]{
  --ink:#ECEFF1; --ink-2:#C5CCD3; --iron:#8F9BA6; --line:#2E3842; --ground:#131920; --panel:#1B232C; --panel-2:#232D37;
  --amber:#F7AD0B; --amber-ink:#FFD777; --amber-soft:#3A2E10;
  --good:#5BC58A; --good-soft:#173324; --warn:#F07A6C; --warn-soft:#3F1F1B;
  --bar:#0E141A; --on-bar:#F2F3F1; --sel:#F7AD0B; --on-sel:#1B2430;
  --c-gym:#c98500; --c-climb:#199e70; --c-walk:#3987e5; --c-stretch:#d55181; --c-other:#9b7ee8;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--on-bar);padding:8px 10px 8px;display:flex;align-items:center;gap:8px;min-height:50px}
header.top h1{font-size:22px;font-weight:700;letter-spacing:.02em;flex:1}
header.top .phase{font-family:var(--display);font-size:14px;color:var(--amber);letter-spacing:.06em;text-transform:uppercase;text-align:right}
header.top .hb{background:none;border:0;color:var(--on-bar);font-family:var(--display);font-size:16px;letter-spacing:.03em;text-transform:uppercase;padding:8px 8px;border-radius:8px;min-width:44px}
header.top .hb:active{background:rgba(255,255,255,.12)}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;max-width:720px;width:100%;margin:0 auto}
main>*{flex-shrink:0}
nav.tabs{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;padding:12px 2px 6px;font-family:var(--display);font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--iron);border-radius:8px;position:relative}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--panel-2)}
nav.tabs button .dot{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:var(--c)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.panel h2{font-size:20px;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--iron)}
.small{font-size:13px}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--iron)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:var(--display);font-size:15px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1B2430}
.btn.small{padding:5px 9px;font-size:13px}
.btn.ghost{background:none}
.btn.big{padding:14px 18px;font-size:20px;width:100%}
.btn.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{flex:1;background:var(--panel-2);border:0;padding:9px 6px;font-family:var(--display);font-size:16px;letter-spacing:.03em;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);font-weight:600}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 auto;min-width:70px}
input[type=number],input[type=date],input[type=text],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=number]{text-align:center;font-variant-numeric:tabular-nums}
textarea{min-height:64px;resize:vertical}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-family:var(--display);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.pill.amber{background:var(--amber-soft);color:var(--amber-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.flag{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:6px;font-size:14px}
.flag.amber{border-color:var(--amber);background:var(--amber-soft)}
.flag.good{border-color:var(--good);background:var(--good-soft)}
/* home */
.datebar{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:6px}
.datebar .arrow{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;font-size:26px;line-height:1;padding:10px 0;cursor:pointer;color:var(--ink);height:56px}
.datebar .d{text-align:center;background:none;border:0;cursor:pointer;color:var(--ink);padding:4px}
.datebar .d .wd{font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--iron)}
.datebar .d .dm{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.05}
.datebar .d .yr{font-size:13px;color:var(--iron)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--iron);text-align:center;padding:2px 0}
.cal button{background:var(--panel-2);border:1px solid transparent;border-radius:8px;padding:6px 0 4px;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--amber)}
.cal button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel)}
.cal button.future{color:var(--iron)}
.dots{display:flex;gap:2px;min-height:6px}
.dots i{display:block;width:6px;height:6px;border-radius:50%;background:var(--c)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.calnav b{font-family:var(--display);font-size:18px;font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--iron)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:4px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:999px;padding:3px 10px 3px 6px;font-size:13px}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
/* exercise card */
.ex{border-top:1px solid var(--line);padding:10px 0 4px}
.ex:first-of-type{border-top:0}
.ex .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex h3{font-size:19px;font-weight:600}
.ex .rx{font-size:13px;color:var(--iron)}
.ex .sug{font-family:var(--display);font-size:15px;color:var(--amber-ink);white-space:nowrap}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:6px;align-items:center;margin-top:8px}
.sets .lab{font-size:12px;color:var(--iron);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.sets .n{font-family:var(--display);font-size:15px;color:var(--iron);text-align:center}
.sets .cp{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 0;font-size:14px;cursor:pointer;color:var(--iron)}
.sets input.done{border-color:var(--good);background:var(--good-soft)}
.ex .tools{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--ink-2);margin-top:6px}
.bar{font-size:13px;color:var(--amber-ink);margin-top:6px;font-weight:500}
.timer{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.02em;min-width:74px;text-align:center}
.timer.done{color:var(--good)}
/* charts */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--iron);font-family:var(--body);font-size:11px}
svg.chart .grid{stroke:var(--line)}
svg.chart .line{stroke:var(--c,var(--amber));fill:none;stroke-width:2}
svg.chart .area{fill:var(--c,var(--amber));opacity:.12}
svg.chart .dot{fill:var(--c,var(--amber))}
svg.chart .target{stroke:var(--good);stroke-dasharray:4 4}
svg.chart .end{fill:var(--ink)}
svg.chart .b{fill:var(--c,var(--amber))}
svg.chart .b.miss{opacity:.45}
svg.chart .lbl{fill:var(--ink)}
.wk{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center}
.wk .nm{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.04em}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--iron)}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
/* guides */
.guide{border-top:1px solid var(--line);padding:8px 0}
.guide summary{cursor:pointer;font-family:var(--display);font-size:18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.guide summary::-webkit-details-marker{display:none}
.guide summary .rx{font-family:var(--body);font-size:12px;color:var(--iron);font-weight:400;text-align:right}
.guide .fig{width:150px;max-width:100%;color:var(--ink)}
.guide .fig svg{width:100%;height:auto}
.guide h4{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--iron);margin:8px 0 2px}
.guide ul{margin:0;padding-left:18px;font-size:14px}
.guide .note{font-size:14px;background:var(--panel-2);padding:8px 10px;border-radius:6px;margin-top:8px}
.guide a{color:var(--amber-ink);font-weight:500}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:120px}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--on-bar);padding:8px 14px;border-radius:8px;font-family:var(--display);font-size:15px;letter-spacing:.03em;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi{background:var(--panel-2);border-radius:8px;padding:8px 10px;border-left:4px solid var(--c,transparent)}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.kpi .l{font-size:12px;color:var(--iron);text-transform:uppercase;letter-spacing:.06em}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--iron);flex:1;min-width:120px}
.toggle{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-family:var(--display);font-size:17px;letter-spacing:.02em;width:100%;text-align:left;color:var(--ink)}
.toggle[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good)}
.toggle .box{width:22px;height:22px;border:2px solid var(--iron);border-radius:6px;display:grid;place-items:center;font-size:15px;flex:none}
.toggle[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.logged{border-left:4px solid var(--c)}
.tip{position:fixed;background:var(--bar);color:var(--on-bar);padding:5px 9px;border-radius:6px;font-size:13px;pointer-events:none;z-index:8;display:none;white-space:nowrap}
</style>
</head>
<body>


<div id="app">
  <header class="top" id="hdr"></header>
  <main id="main"></main>
  <nav class="tabs" id="ribbon" hidden>
    <button data-act="walk" style="--c:var(--c-walk)">Walk</button>
    <button data-act="stretch" style="--c:var(--c-stretch)">Stretch</button>
    <button data-act="gym" style="--c:var(--c-gym)">Gym</button>
    <button data-act="climb" style="--c:var(--c-climb)">Climb</button>
    <button data-act="other" style="--c:var(--c-other)">Other</button>
  </nav>
  <div class="toast" id="toast"></div>
  <div class="tip" id="tip"></div>
</div>

5}, {"name": "Rower Finisher", "sets": "4-6", "reps": "250 m, 1:1 rest", "optional": true, "note": "once a week"}]}, {"id": "1", "phases": [3], "title": "Phase 3 Day 1", "exercises": [{"name": "Barbell Bench Press", "sets": 3, "reps": "8-10", "resume": 42.5, "progression": "double: 3x8 -> 3x10 then +2.5 kg"}, {"name": "Neutral Grip Lat Pulldown", "sets": 3, "reps": "8-10", "resume": 52}, {"name": "Leg Press", "sets": 3, "reps": "8-10", "resume": "110-120"}, {"name": "Lateral Raise", "sets": 3, "reps": "10-12", "resume": 6}, {"name": "Adductor", "sets": 3, "reps": "10-12", "resume": 55}, {"name": "Abductor", "sets": 3, "reps": "10-12", "resume": 65}, {"name": "Single Leg Leg Extensions", "sets": 1, "reps": "12,11,10...1", "resume": "25-26", "log": "weight and set that failed (12-1)"}, {"name": "Single Arm Biceps Curls", "sets": 2, "reps": "10-12 light", "rule": "only the day after climbing; drop first if forearm flares"}]}, {"id": "2", "phases": [3], "title": "Phase 3 Day 2 (furthest from climbing)", "exercises": [{"name": "Barbell Deadlift", "sets": 3, "reps": "8-10", "resume": 55}, {"name": "Barbell Row", "sets": 3, "reps": "8-10", "resume": 50}, {"name": "Plate Loaded Shoulder Press", "sets": 3, "reps": "8-10", "resume": 15}, {"name": "Assisted Pull-Ups / Negatives", "sets": 3, "reps": "5-8", "log": "assistance|reps", "note": "monthly strict neutral-grip test, log reps; first rep target month 4-6"}, {"name": "Barbell Overhead Skull Crusher", "sets": 3, "reps": "10", "resume": 15}, {"name": "Barbell Close Grip Bench Press", "sets": 3, "reps": "10", "resume": 20}, {"name": "Oblique Cable Crunches", "sets": 3, "reps": "15-20", "resume": 21.25}, {"name": "Forwards Cable Crunch", "sets": 1, "reps": "to failure", "resume": 28.75}]}, {"id": "3", "phases": [3], "title": "Phase 3 Day 3", "exercises": [{"name": "Barbell Squat", "sets": 3, "reps": "8-10", "resume": 50}, {"name": "Barbell RDL", "sets": 3, "reps": "8-10", "resume": 52.5}, {"name": "Upright Hamstring Curls", "s 118\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M132 94 L150 110\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M96 58 L88 44\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M76 62 Q92 76 118 78\" stroke=\"#F7AD0B\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ah)\"/><path d=\"M160 60 Q170 70 162 82\" stroke=\"#F7AD0B\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "touchcrunch", "title": "Alternating Touch Crunch", "rx": "Phase 3 Day 3 · 2×15 each — left leg, right leg, both", "video": "https://www.youtube.com/watch?v=-PiOdPEXYXw", "videoLabel": "Alternating Toe Touches (tutorial)", "setup": ["On your back, legs extended, arms overhead."], "execution": ["Crunch up and reach for the raised foot — left, then right, then both legs together.", "Exhale hard at the top of each rep; lower with control."], "watch": ["Pulling the head with the hands.", "Letting the legs crash down between reps."], "note": "", "svg": "<svg viewBox=\"0 0 220 130\" role=\"img\" aria-hidden=\"true\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 z\" fill=\"#F7AD0B\"/></marker></defs><line x1=\"8\" y1=\"118\" x2=\"212\" y2=\"118\" stroke=\"#9aa2ad\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"64\" cy=\"88\" r=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M72 92 L116 104\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M116 104 L140 84\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M116 104 L152 112\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" fill=\"none\" opacity=\".55\"/><path d=\"M74 86 L118 74\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" fill=\"none\"/><pa "none\"/><path d=\"M138 92 L168 92\" stroke=\"#F7AD0B\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ah)\"/></svg>"}];

<script>
/* ---------- constants ---------- */
const KEY='gtfit.v2', OLDKEY='gymlog2026.v1', BAR=20;
const ACTS=['walk','stretch','gym','climb','other'];
const OTHERS=['cycle','hike','swim','custom'];
const FAMILY=k=>OTHERS.includes(k)?'other':k;               // colour family of a kind
const COLOR={walk:'var(--c-walk)',stretch:'var(--c-stretch)',gym:'var(--c-gym)',climb:'var(--c-climb)',other:'var(--c-other)'};
const LABEL={walk:'Walk',stretch:'Stretch',gym:'Gym',climb:'Climb',other:'Other',cycle:'Cycle',hike:'Hike',swim:'Swim',custom:'Custom'};
const DEFAULT_START='2026-09-21';
const CLIMB_LOCS=['Castle Hill','St Peters','St Leonards','Macquarie Park'];

/* ---------- state ---------- */
const today=()=>{ const d=new Date(); return iso(d); };
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const blank=()=>({v:2, view:'home', date:today(), act:'gym', otherKind:'cycle', dayOverride:null, histKey:null, trendTab:'all', calOpen:false, calMonth:null,
  settings:{programmeStart:DEFAULT_START, barMode:'total', targets:{gym:2,climb:1,walk:7,stretch:7,other:1}, climbLocations:CLIMB_LOCS.slice()},
  sessions:[], pullupTests:[], entries:[], migrated:null});
let S=blank();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); S=Object.assign(blank(),o); S.settings=Object.assign(blank().settings,o.settings||{}); S.settings.targets=Object.assign(blank().settings.targets,(o.settings||{}).targets||{}); return; } migrate(); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function migrate(){ // v1 store → v2; the v1 record is left in place under its own key
  const r=localStorage.getItem(OLDKEY); if(!r) return; let o; try{ o=JSON.parse(r); }catch(e){ return; }
  S=blank(); const n={sessions:0,climbs:0,flares:0,tests:0};
  S.sessions=(o.sessions||[]).map(s=>Object.assign({comment:''},s)); n.sessions=S.sessions.length;
  S.pullupTests=o.pullupTests||[]; n.tests=S.pullupTests.length;
  if(o.barMode) S.settings.barMode=o.barMode;
  (o.climbDates||[]).forEach(d=>{ S.entries.push({id:uid(),date:d,type:'climb',boulder:false,toprope:false,location:'',note:''}); n.climbs++; });
  (o.flareDates||[]).forEach(d=>{ const s=S.sessions.find(x=>x.date===d); const t='Elbow/forearm flare logged (carried from v1).'; if(s) s.comment=(s.comment?s.comment+' ':'')+t; else S.entries.push({id:uid(),date:d,type:'custom',name:'Elbow flare',note:t}); n.flares++; });
  S.migrated={on:today(),from:'v1',counts:n}; save();
}
const parse=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays=(s,n)=>{ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const fmt=s=>parse(s).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const fmtLong=s=>parse(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const monthName=(y,m)=>new Date(y,m,1).toLocaleDateString('en-AU',{month:'long',year:'numeric'});
const weekStart=s=>{ const d=parse(s); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return iso(d); }; // Monday
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }

/* ---------- entries ---------- */
const entriesOn=(date,type)=>S.entries.filter(e=>e.date===date&&(!type||e.type===type));
function entry(date,type){ return S.entries.find(e=>e.date===date&&e.type===type)||null; }
function addEntry(date,type,fields){ const e=Object.assign({id:uid(),date,type,note:''},fields); S.entries.push(e); S.entries.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); save(); return e; }
function removeEntry(e){ S.entries=S.entries.filter(x=>x!==e); save(); }
function clearDay(date){ S.entries=S.entries.filter(e=>e.date!==date); S.sessions=S.sessions.filter(s=>s.date!==date); save(); }
function gymOn(date){ return S.sessions.filter(s=>s.date===date && sessionHasData(s)); }
const sessionHasData=s=> s.bodyweight!=='' || (s.comment&&s.comment.trim()!=='') || Object.values(s.sets).some(a=>a.some(x=>x.w!==''||x.r!==''));
function familiesOn(date){ const f=new Set(); if(gymOn(date).length) f.add('gym'); entriesOn(date).forEach(e=>f.add(FAMILY(e.type))); return ACTS.filter(a=>f.has(a)); }
function kindsOn(date){ const k=[]; if(gymOn(date).length) k.push('gym'); entriesOn(date).forEach(e=>{ if(!k.includes(e.type)) k.push(e.type); }); return k; }
function occurrences(kind){ // one per date
  if(kind==='gym') return [...new Set(S.sessions.filter(sessionHasData).map(s=>s.date))].sort();
  if(kind==='other') return [...new Set(S.entries.filter(e=>OTHERS.includes(e.type)).map(e=>e.date))].sort();
  return [...new Set(S.entries.filter(e=>e.type===kind).map(e=>e.date))].sort();
}
function previousValues(type,field){ const seen=[]; [...S.entries].reverse().forEach(e=>{ if(e.type===type && e[field] && !seen.includes(e[field])) seen.push(e[field]); }); return seen; }

/* ---------- programme logic ---------- */
const LOWER=/squat|deadlift|rdl|leg press|leg ext|hamstring|adductor|abductor|swing/i;
const isLower=n=>LOWER.test(n);
const isBarbell=n=>/barbell/i.test(n) && !/skull/i.test(n);
const isEZ=n=>/skull/i.test(n);
function barText(v){ const w=parseFloat(v); if(isNaN(w)) return ''; if(S.settings.barMode==='plates'){ return `${w} kg of plates · ${(w/2)} kg a side · ${w+BAR} kg total with the ${BAR} kg bar`; } const per=(w-BAR)/2; return per<0?`${w} kg is under the ${BAR} kg bar`:`${w} kg total incl. ${BAR} kg bar · ${per} kg a side`; }
function weekNo(date){ const st=S.settings.programmeStart; if(!st||date<st) return 0; return Math.floor(daysBetween(st,date)/7)+1; }
function phaseOf(w){ return w<=0?0 : w<=3?1 : w<=8?2 : 3; }
function dayIds(ph){ return ph===3?['1','2','3']:['A','B']; }
function dayById(id){ return PROGRAMME.days.find(d=>d.id===id); }
function sessionsOn(date){ return S.sessions.filter(s=>s.date===date); }
function getSession(date,dayId){ let s=S.sessions.find(x=>x.date===date&&x.day===dayId); if(!s){ s={date,day:dayId,bodyweight:'',sets:{},comment:''}; S.sessions.push(s); S.sessions.sort((a,b)=>a.date<b.date?-1:1); } if(s.comment==null) s.comment=''; return s; }
function exKey(n){ return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function lastLogged(key,beforeDate){ const list=S.sessions.filter(s=>s.date<beforeDate && s.sets[key] && s.sets[key].some(x=>x.w!==''||x.r!=='')).sort((a,b)=>a.date<b.date?1:-1); return list[0]?{date:list[0].date,sets:list[0].sets[key]}:null; }
function suggestLoad(ex,date,ph){
  const key=exKey(ex.name); const last=lastLogged(key,date);
  if(!last){ const v= ph===3 ? (ex.resume??ex.start) : (ex.start??ex.resume); return v==null?{v:'',why:'no load set'}:{v:String(v),why:ph===3?'resume load':'start load'}; }
  const ws=last.sets.map(x=>parseFloat(x.w)).filter(x=>!isNaN(x)); const rs=last.sets.map(x=>parseInt(x.r)).filter(x=>!isNaN(x));
  if(!ws.length) return {v:'',why:'last: reps only'};
  const top=Math.max(...ws);
  if(ex.log==='assistance|reps'){ return {v:String(top),why:'last assist '+top+' kg'+(top<=35?' — add negatives':'')}; }
  if(ph===2){ if(isLower(ex.name)) return {v:String(top+2.5),why:'+2.5 kg on last ('+top+')'}; const wk=weekNo(last.date); return wk<weekNo(date)?{v:String(top+2.5),why:'+2.5 kg, new week'}:{v:String(top),why:'hold this week ('+top+')'}; }
  if(ph===3 && /bench press$/i.test(ex.name) && !/close/i.test(ex.name)){ const all10=rs.length>=3&&rs.every(r=>r>=10); return all10?{v:String(top+2.5),why:'3×10 hit — +2.5 kg'}:{v:String(top),why:'work 3×8 → 3×10'}; }
  return {v:String(top),why:'last '+fmt(last.date)};
}
function setsFor(ex,ph){ if(ph===1 && typeof ex.sets==='number' && ex.sets>2) return 2; return typeof ex.sets==='number'?ex.sets:3; }
const climbDates=()=>occurrences('climb');
function lastClimb(date){ const l=climbDates().filter(c=>c<=date).sort().reverse(); return l[0]||null; }

function calendar(){
  const base=S.calMonth||S.date.slice(0,7); const [y,mo]=base.split('-').map(Number);
  const first=new Date(y,mo-1,1); const start=(first.getDay()+6)%7; const dim=new Date(y,mo,0).getDate();

  wrap.append(el('div',{class:'calnav'}, el('button',{class:'btn small',onclick:()=>{ const d=new Date(y,mo-2,1); S.calMonth=iso(d).slice(0,7); save(); render(); }},'‹'), el('b',{},monthName(y,mo-1)), el('button',{class:'btn small',onclick:()=>{ const d=new Date(y,mo,1); S.calMonth=iso(d).slice(0,7); save(); render(); }},'›')));
  const g=el('div',{class:'cal'}); ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(h=>g.append(el('div',{class:'h'},h)));

    g.append(el('button',{class:(ds===today()?'today ':'')+(ds>today()?'future':''),'aria-pressed':String(ds===S.date),'aria-label':fmtLong(ds),onclick:()=>{S.date=ds;S.clearArm=null;save();render();}}, String(d), el('span',{class:'dots'},...fams.map(f=>el('i',{style:'--c:'+COLOR[f]}))))); }

function nextDay(ids,date){ const past=S.sessions.filter(s=>s.date<date&&ids.includes(s.day)&&sessionHasData(s)).sort((a,b)=>a.date<b.date?1:-1)[0]; if(!past) return ids[0]; const i=ids.indexOf(past.day); return ids[(i+1)%ids.length]; }

function startTimer(sec){ clearInterval(TIMER.h); TIMER.left=sec; TIMER.total=sec; const t=$('#timer'); if(t){t.textContent=mmss(sec);t.classList.remove('done');}
  TIMER.h=setInterval(()=>{ TIMER.left--; const t=$('#timer'); if(t) t.textContent=mmss(Math.max(0,TIMER.left)); if(TIMER.left<=0){ clearInterval(TIMER.h); if(t){t.textContent='GO';t.classList.add('done');} try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} } },1000); }

function pullupSeries(){ const out=[]; S.sessions.forEach(s=>{ ['assisted-pull-ups-neutral-grip','assisted-pull-ups-negatives'].forEach(k=>{ if(s.sets[k]){ const ws=s.sets[k].map(x=>parseFloat(x.w)).filter(x=>!isNaN(x)); const rs=s.sets[k].map(x=>parseInt(x.r)).filter(x=>!isNaN(x)); if(ws.length) out.push({date:s.date,assist:Math.min(...ws),reps:rs.length?Math.max(...rs):null}); } }); }); return out.sort((a,b)=>a.date<b.date?-1:1); }

  const svg=svgEl(W,H,color); const mk=(t,a)=>mkIn(svg,t,a);
  if(!short){ [0,hi].forEach(v=>{ mk('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),class:'grid'}); const tx=mk('text',{x:L-4,y:y(v)+4,'text-anchor':'end'}); tx.textContent=v; }); } else mk('line',{x1:L,x2:W-R,y1:y(0),y2:y(0),class:'grid'});
  bars.forEach((b,i)=>{ const h=Math.max(0,y(0)-y(b.y)); const miss=target!=null&&b.y<target; const r=mk('rect',{x:x(i)+bw*.18,y:y(b.y),width:bw*.64,height:h,rx:3,class:'b'+(miss?' miss':'')}); const lab=monthly?b.label:('w/c '+fmt(b.x)); tipOn(r,`${lab} · ${decimals?b.y.toFixed(decimals):b.y}`);
    if(b.y>0){ const tx=mk('text',{x:x(i)+bw/2,y:y(b.y)-3,'text-anchor':'middle',class:'lbl'}); tx.textContent=decimals?b.y.toFixed(decimals):b.y; }
    if(!short||i%2===0||n<=6){ const tx=mk('text',{x:x(i)+bw/2,y:H-6,'text-anchor':'middle'}); tx.textContent=monthly?b.label:fmt(b.x); } });
  if(target!=null){ mk('line',{x1:L,x2:W-R,y1:y(target),y2:y(target),class:'target'}); if(!short){ const tx=mk('text',{x:W-R,y:y(target)-4,'text-anchor':'end'}); tx.textContent='target '+target; } }
  return svg;
}

async function copyOrShow(t,boxId,msg){ try{ await navigator.clipboard.writeText(t); toast(msg); }catch(e){ const b=$('#'+boxId); b.hidden=false; b.value=t; toast('Select and copy below'); } }
function exportSheet5(){
  const keys=allExerciseKeys(); const ses=S.sessions.filter(sessionHasData).sort((a,b)=>a.date<b.date?-1:1);
  const hdr=['Exercise ('+(S.settings.barMode==='plates'?'barbell loads: plates only':'barbell loads: total incl. '+BAR+' kg bar')+')', ...ses.flatMap(s=>[s.date+' D'+s.day,''])];
  const lines=[hdr.join('\t'), ['Bodyweight (kg)',...ses.flatMap(s=>[s.bodyweight||'',''])].join('\t')];
  PROGRAMME.days.forEach(d=>{ lines.push(d.title.toUpperCase()); d.exercises.forEach(e=>{ const k=exKey(e.name); const maxSets=Math.max(1,...ses.map(s=>(s.sets[k]||[]).filter(x=>x.w!==''||x.r!=='').length));
    for(let i=0;i<maxSets;i++){ lines.push([i===0?`${e.name} ${e.sets}x${e.reps}`:'', ...ses.flatMap(s=>{ const st=(s.sets[k]||[]).filter(x=>x.w!==''||x.r!=='')[i]; return st?[st.w,st.r]:['','']; })].join('\t')); } }); });
  lines.push('COMMENTS', ['', ...ses.flatMap(s=>[(s.comment||'').replace(/\s+/g,' '),''])].join('\t'));
  return lines.join('\n');
}
function exportActivities(){
  const rows=[['date','activity','detail','distance_km','note']];
  S.sessions.filter(sessionHasData).forEach(s=>rows.push([s.date,'gym','Day '+s.day+(s.bodyweight?' · '+s.bodyweight+' kg':''),'',(s.comment||'')]));
  S.entries.forEach(e=>{ const detail=describe(e); rows.push([e.date,e.type,e.type==='stretch'?'stretched':detail.replace(/ · [\d.]+ km$/,''),e.distance||'',e.type==='stretch'?(e.note||''):(e.type==='swim'||e.type==='custom'?'':(e.note||''))]); });
  rows.sort((a,b)=>a===rows[0]?-1:b===rows[0]?1:(a[0]<b[0]?-1:a[0]>b[0]?1:0));
  return rows.map(r=>r.map(x=>String(x).replace(/\t|\n/g,' ')).join('\t')).join('\n');
}
