<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Gym Log 2026</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2430">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#1B2430; --ink-2:#3C4855; --iron:#5B6873; --line:#D5D9D6; --ground:#F2F3F1; --panel:#FFFFFF; --panel-2:#E9ECE9;
  --amber:#F7AD0B; --amber-ink:#7A5200; --amber-soft:#FFF3D1;
  --good:#2F8F5B; --good-soft:#DFF2E6; --warn:#C43D2F; --warn-soft:#F9E1DD;
  --bar:#1B2430; --on-bar:#FFFFFF; --sel:#1B2430; --on-sel:#F7AD0B;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#ECEFF1; --ink-2:#C5CCD3; --iron:#8F9BA6; --line:#2E3842; --ground:#131920; --panel:#1B232C; --panel-2:#232D37;
  --amber:#F7AD0B; --amber-ink:#FFD777; --amber-soft:#3A2E10;
  --good:#5BC58A; --good-soft:#173324; --warn:#F07A6C; --warn-soft:#3F1F1B;
  --bar:#0E141A; --on-bar:#F2F3F1; --sel:#F7AD0B; --on-sel:#1B2430;
}}
:root[data-theme="dark"]{
  --ink:#ECEFF1; --ink-2:#C5CCD3; --iron:#8F9BA6; --line:#2E3842; --ground:#131920; --panel:#1B232C; --panel-2:#232D37;
  --amber:#F7AD0B; --amber-ink:#FFD777; --amber-soft:#3A2E10;
  --good:#5BC58A; --good-soft:#173324; --warn:#F07A6C; --warn-soft:#3F1F1B;
  --bar:#0E141A; --on-bar:#F2F3F1; --sel:#F7AD0B; --on-sel:#1B2430;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--on-bar);padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:22px;font-weight:700;letter-spacing:.02em}
header.top .phase{font-family:var(--display);font-size:15px;color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;max-width:720px;width:100%;margin:0 auto}
nav.tabs{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;padding:8px 2px 6px;font-family:var(--display);font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--iron);border-radius:8px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--panel-2)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.panel h2{font-size:20px;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--iron)}
.small{font-size:13px}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--iron)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:var(--display);font-size:15px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1B2430}
.btn.small{padding:5px 9px;font-size:13px}
.btn.ghost{background:none}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:var(--panel-2);border:0;padding:9px 6px;font-family:var(--display);font-size:16px;letter-spacing:.03em;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);font-weight:600}
input[type=number],input[type=date],input[type=text],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=number]{text-align:center;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-family:var(--display);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.pill.amber{background:var(--amber-soft);color:var(--amber-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.flag{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:6px;font-size:14px}
.flag.amber{border-color:var(--amber);background:var(--amber-soft)}
.flag.good{border-color:var(--good);background:var(--good-soft)}
/* exercise card */
.ex{border-top:1px solid var(--line);padding:10px 0 4px}
.ex:first-of-type{border-top:0}
.ex .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex h3{font-size:19px;font-weight:600}
.ex .rx{font-size:13px;color:var(--iron)}
.ex .sug{font-family:var(--display);font-size:15px;color:var(--amber-ink);white-space:nowrap}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:6px;align-items:center;margin-top:8px}
.sets .lab{font-size:12px;color:var(--iron);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.sets .n{font-family:var(--display);font-size:15px;color:var(--iron);text-align:center}
.sets .cp{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 0;font-size:14px;cursor:pointer;color:var(--iron)}
.sets input.done{border-color:var(--good);background:var(--good-soft)}
.ex .tools{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--ink-2);margin-top:6px}
.bar{font-size:13px;color:var(--amber-ink);margin-top:6px;font-weight:500}
.timer{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.02em;min-width:74px;text-align:center}
.timer.done{color:var(--good)}
/* history + charts */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--iron);font-family:var(--body);font-size:11px}
svg.chart .grid{stroke:var(--line)}
svg.chart .line{stroke:var(--amber);fill:none;stroke-width:2.5}
svg.chart .area{fill:var(--amber);opacity:.12}
svg.chart .dot{fill:var(--amber)}
svg.chart .target{stroke:var(--good);stroke-dasharray:4 4}
svg.chart .end{fill:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--iron)}
.scroll{overflow-x:auto}
/* guides */
.guide{border-top:1px solid var(--line);padding:8px 0}
.guide summary{cursor:pointer;font-family:var(--display);font-size:18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary .rx{font-family:var(--body);font-size:12px;color:var(--iron);font-weight:400}
.guide .fig{width:150px;max-width:100%;color:var(--ink)}
.guide .fig svg{width:100%;height:auto}
.guide h4{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--iron);margin:8px 0 2px}
.guide ul{margin:0;padding-left:18px;font-size:14px}
.guide .note{font-size:14px;background:var(--panel-2);padding:8px 10px;border-radius:6px;margin-top:8px}
.guide a{color:var(--amber-ink);font-weight:500}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:120px}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--on-bar);padding:8px 14px;border-radius:8px;font-family:var(--display);font-size:15px;letter-spacing:.03em;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--panel-2);border-radius:8px;padding:8px 10px}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.kpi .l{font-size:12px;color:var(--iron);text-transform:uppercase;letter-spacing:.06em}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--iron);flex:1;min-width:120px}
</style>
</head>
<body>

<script>
/* ---------- state ---------- */
const KEY='gymlog2026.v1';
const blank=()=>({startDate:null, climbDates:[], flareDates:[], sessions:[], pullupTests:[], tab:'today', dayOverride:null, barMode:'total'});
const BAR=20;
const isBarbell=n=>/barbell/i.test(n) && !/skull/i.test(n);
const isEZ=n=>/skull/i.test(n);
function barText(v){ const w=parseFloat(v); if(isNaN(w)) return ''; if(S.barMode==='plates'){ return `${w} kg of plates · ${(w/2)} kg a side · ${w+BAR} kg total with the ${BAR} kg bar`; } const per=(w-BAR)/2; return per<0?`${w} kg is under the ${BAR} kg bar`:`${w} kg total incl. ${BAR} kg bar · ${per} kg a side`; }
let S=blank();
function load(){ try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(blank(),JSON.parse(r)); }catch(e){} }

const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }

/* ---------- programme logic ---------- */
const LOWER=/squat|deadlift|rdl|leg press|leg ext|hamstring|adductor|abductor|swing/i;

function weekNo(date){ if(!S.startDate) return 0; return Math.floor(daysBetween(S.startDate,date)/7)+1; }
function phaseOf(w){ return w<=0?0 : w<=3?1 : w<=8?2 : 3; }

function dayById(id){ return PROGRAMME.days.find(d=>d.id===id); }

function exKey(n){ return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function lastLogged(key,beforeDate){ // most recent session with any set for this exercise
  const list=S.sessions.filter(s=>s.date<beforeDate && s.sets[key] && s.sets[key].some(x=>x.w!==''||x.r!=='')).sort((a,b)=>a.date<b.date?1:-1);
  return list[0]?{date:list[0].date,sets:list[0].sets[key]}:null;
}
function suggestLoad(ex,date,ph){
  const key=exKey(ex.name); const last=lastLogged(key,date);
  if(!last){ const v= ph===3 ? (ex.resume??ex.start) : (ex.start??ex.resume); return v==null?{v:'',why:'no load set'}:{v:String(v),why:ph===3?'resume load':'start load'}; }
  const ws=last.sets.map(x=>parseFloat(x.w)).filter(x=>!isNaN(x)); const rs=last.sets.map(x=>parseInt(x.r)).filter(x=>!isNaN(x));
  if(!ws.length) return {v:'',why:'last: reps only'};

  if(ex.log==='assistance|reps'){ return {v:String(top),why:'last assist '+top+' kg'+(top<=35?' — add negatives':'')}; }
  if(ph===2){ // +2.5 kg/session lower, +2.5 kg/week upper
    if(isLower(ex.name)) return {v:String(top+2.5),why:'+2.5 kg on last ('+top+')'};
    const wk=weekNo(last.date); return wk<weekNo(date)?{v:String(top+2.5),why:'+2.5 kg, new week'}:{v:String(top),why:'hold this week ('+top+')'};
  }
  if(ph===3 && /bench press$/i.test(ex.name) && !/close/i.test(ex.name)){ const all10=rs.length>=3&&rs.every(r=>r>=10); return all10?{v:String(top+2.5),why:'3×10 hit — +2.5 kg'}:{v:String(top),why:'work 3×8 → 3×10'}; }
  return {v:String(top),why:'last '+fmt(last.date)};
}
function setsFor(ex,ph){ if(ph===1 && typeof ex.sets==='number' && ex.sets>2) return 2; return typeof ex.sets==='number'?ex.sets:3; }
function climbedWithin(date,hours){ return S.climbDates.some(c=>{ const d=daysBetween(c,date); return d>=0 && d*24<hours; }); }
function lastClimb(date){ const l=S.climbDates.filter(c=>c<=date).sort().reverse(); return l[0]||null; }
const GUIDEMAP={ 'barbell-squat':'squat','barbell-bench-press':'bench','neutral-grip-lat-pulldown':'pulldown','leg-press':'legpress','explosive-leg-press':'legpress','lateral-raise':'latraise','forwards-cable-crunch':'cablecrunch','kettlebell-swings':'kbswing','barbell-rdl':'rdl','plate-loaded-shoulder-press':'shoulderpress','assisted-pull-ups-neutral-grip':'assistpullup','dumbbell-single-arm-row':'dbrow','upright-hamstring-curls':'hamcurl','adductor-abductor-superset':'adductor','oblique-cable-crunches':'obliquecrunch','rower-finisher':'erg','single-leg-leg-extensions':'legext','single-arm-biceps-curls':'curl','adductor':'adductor','abductor':'abductor','barbell-deadlift':'deadlift','barbell-row':'bbrow','assisted-pull-ups-negatives':'negative','barbell-overhead-skull-crusher':'skull','barbell-close-grip-bench-press':'cgbench','dumbbell-flys':'fly','dumbbell-incline-y-raise':'yraise','alternating-touch-crunch':'touchcrunch','rower-finisher-or-easy-cycle-next-day':'erg' };
const guideFor=ex=>GUIDES.find(g=>g.id===GUIDEMAP[exKey(ex.name)]);

/* ---------- rendering ---------- */
const $=s=>document.querySelector(s); const el=(t,a={},...c)=>{ const e=document.createElement(t); for(const k in a){ if(k==='class')e.className=a[k]; else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]); else if(k==='html')e.innerHTML=a[k]; else e.setAttribute(k,a[k]); } c.flat().forEach(x=>{ if(x==null) return; e.append(x.nodeType?x:document.createTextNode(String(x))); }); return e; };
let TIMER={left:0,total:0,h:null};
function render(){ const m=$('#main'); m.replaceChildren(); document.querySelectorAll('#tabs button').forEach(b=>{ if(b.dataset.tab===S.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  const w=weekNo(today()); const ph=phaseOf(w); $('#phaseLabel').textContent = ph? `Phase ${ph} · Week ${w}` : 'Not started';
  ({today:renderToday,pullups:renderPullups,history:renderHistory,guides:renderGuides,more:renderMore})[S.tab](m); }
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.tab; save(); render(); $('#main').scrollTop=0; });

function renderToday(m){
  const date=today(); const w=weekNo(date); let ph=phaseOf(w);
  if(!S.startDate){ m.append(el('div',{class:'panel stack'},
    el('h2',{},'Week 1 starts on your first session'),
    el('p',{class:'muted small'},'Phase 1 (weeks 1–3): 2 working sets, about 60% of your Sheet4 loads, 3–4 reps short of failure. Loads below are the pre-filled start loads. Log the first set and today becomes day 1 of week 1.'),
    el('div',{class:'row'}, el('label',{class:'f'},'Or set a start date', el('input',{type:'date',id:'startDateInput',value:date,onchange:e=>{S.startDate=e.target.value;save();render();}})))
  )); ph=1; }

  const dayDef=dayById(active);
  const banner=el('div',{class:'panel stack'},
    el('div',{class:'row between'}, el('div',{}, el('div',{class:'eyebrow'},fmtLong(date)), el('h2',{},`Phase ${ph} · ${phaseInfo.weeks.replace('-','–').replace('9+','week 9+')}`.replace('· 1–3','· weeks 1–3').replace('· 4–8','· weeks 4–8')), el('div',{class:'small muted'},phaseInfo.load_rule)),
      el('div',{class:'row'}, el('div',{class:'timer num',id:'timer'},TIMER.left?mmss(TIMER.left):'—'), el('button',{class:'btn small',onclick:()=>startTimer(90)},'Rest 90'), el('button',{class:'btn small',onclick:()=>startTimer(120)},'Rest 120'))),
    el('div',{class:'seg',role:'group','aria-label':'Session day'}, ...ids.map(id=>el('button',{'aria-pressed':String(id===active),onclick:()=>{S.dayOverride=id;save();render();}},'Day '+id))),
    el('div',{class:'small muted'},dayDef.title + (S.climbDates.length?` · last climb ${fmt(lastClimb(date)||S.climbDates[0])}`:' · no climb logged yet'))
  );
  m.append(banner);
  // day flags
  const flags=el('div',{class:'stack'});
  const flared=S.flareDates.includes(date);
  const lc=lastClimb(date); const sinceClimb=lc?daysBetween(lc,date):null;
  if(dayDef.exercises.some(e=>/pull-up/i.test(e.name)) && sinceClimb!==null && sinceClimb<2) flags.append(el('div',{class:'flag amber'},`Climbed ${sinceClimb===0?'today':'yesterday'} — pull-up work wants ≥ 48 h from climbing, or same day after it. Consider swapping the pull-up slot or going light.`));
  if(active==='1' && sinceClimb!==1) flags.append(el('div',{class:'flag amber'},'Day 1 curls are for the day after climbing only — skip them today unless you climbed yesterday.'));
  if(flared) flags.append(el('div',{class:'flag'},'Elbow/forearm flare logged for today: curls and flys are hidden. Keep pressing and climbing steady; physio guidance governs.'));
  if(flags.children.length) m.append(flags);
  // session controls
  const s=getSession(date,active);
  m.append(el('div',{class:'panel row between'},
    el('label',{class:'f'},'Bodyweight (kg)', el('input',{type:'number',step:'0.1',inputmode:'decimal',id:'bw',value:s.bodyweight||'',onchange:e=>{s.bodyweight=e.target.value;touch(date);}})),
    el('div',{class:'stack'},
      el('button',{class:'btn small'+(S.climbDates.includes(date)?' primary':''),onclick:()=>{toggleIn(S.climbDates,date);save();render();}},S.climbDates.includes(date)?'Climbed today ✓':'Climbed today'),
      el('button',{class:'btn small'+(flared?' primary':''),onclick:()=>{toggleIn(S.flareDates,date);save();render();}},flared?'Elbow flare ✓':'Elbow flare'))
  ));

  card.append(el('h2',{},'Day '+active), el('div',{class:'small muted'},'Warm-up: 1 km easy row, then one light feeder set of the first exercise. Rests 90–120 s.'));
  dayDef.exercises.forEach(ex=>{
    if(ex.phase_from && ph<ex.phase_from) { card.append(el('div',{class:'ex'}, el('div',{class:'head'}, el('div',{}, el('h3',{class:'muted'},ex.name), el('div',{class:'rx'},`Enters in Phase ${ex.phase_from}`))))); return; }
    if(flared && /fly|curl/i.test(ex.name)) return;
    const key=exKey(ex.name); const n=setsFor(ex,ph); const sug=suggestLoad(ex,date,ph);
    if(!s.sets[key]) s.sets[key]=Array.from({length:n},()=>({w:'',r:''}));
    while(s.sets[key].length<n) s.sets[key].push({w:'',r:''});
    const assist=ex.log==='assistance|reps'; const g=guideFor(ex);
    const box=el('div',{class:'ex'});
    box.append(el('div',{class:'head'}, el('div',{}, el('h3',{},ex.name), el('div',{class:'rx'},`${n}×${ex.reps}${ex.note?' · '+ex.note:''}${ex.rule?' · '+ex.rule:''}${ex.progression?' · '+ex.progression:''}`)), el('div',{class:'sug num'}, sug.v?(assist?sug.v+' kg assist':sug.v+' kg'):'')));
    const grid=el('div',{class:'sets'}, el('div'),el('div',{class:'lab'},assist?'Assist kg':'kg'),el('div',{class:'lab'},'reps'),el('div'));
    s.sets[key].forEach((st,i)=>{
      const wi=el('input',{type:'number',step:'0.25',inputmode:'decimal',placeholder:sug.v||'',value:st.w,'aria-label':`${ex.name} set ${i+1} weight`,onchange:e=>{st.w=e.target.value;mark();touch(date);}});
      const ri=el('input',{type:'number',step:'1',inputmode:'numeric',placeholder:ex.reps.split(/[^0-9]/)[0]||'',value:st.r,'aria-label':`${ex.name} set ${i+1} reps`,onchange:e=>{st.r=e.target.value;mark();touch(date);}});
      const mark=()=>{ const d=st.w!==''||st.r!==''; wi.classList.toggle('done',d); ri.classList.toggle('done',d); }; mark();
      const cp=el('button',{class:'cp',title:'Copy previous set',onclick:()=>{ const p=i?s.sets[key][i-1]:{w:sug.v,r:''}; st.w=p.w; st.r=p.r||st.r; wi.value=st.w; ri.value=st.r; mark(); touch(date); }},'⤶');
      grid.append(el('div',{class:'n'},i+1),wi,ri,cp);

function lineChart(pts,{target=null,targetLabel=''}){

  const mk=(t,a)=>{ const e=document.createElementNS(ns,t); for(const k in a) e.setAttribute(k,a[k]); svg.append(e); return e; };
  const ticks=4; for(let i=0;i<=ticks;i++){ const v=lo+(hi-lo)*i/ticks; mk('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),class:'grid'}); const tx=mk('text',{x:L-6,y:y(v)+4,'text-anchor':'end'}); tx.textContent=(Math.round(v*2)/2).toString(); }

  const d=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.y)).join(' ');
  mk('path',{d:d+` L${x(pts.length-1)} ${H-B} L${x(0)} ${H-B} Z`,class:'area'}); mk('path',{d,class:'line'});
  pts.forEach((p,i)=>mk('circle',{cx:x(i),cy:y(p.y),r:i===pts.length-1?5:3,class:i===pts.length-1?'end':'dot'}));

}
